.ring{animation:b-ring 2s ease-out infinite}
.fill{animation:b-fill 3s cubic-bezier(.4,0,.2,1) 1.4s infinite}
.grow{transform-origin:left;animation:b-grow .9s cubic-bezier(.2,.8,.2,1) .4s both}
